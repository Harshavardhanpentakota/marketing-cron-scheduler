[project]
name = "marketing-cron-service"
version = "0.1.0"
description = "FastAPI Background Scheduler for WhatsApp and Email Marketing Alerts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "apscheduler>=3.10.4",
    "sqlalchemy>=2.0.30",
    "croniter>=2.0.5",
    "pydantic-settings>=2.4.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
